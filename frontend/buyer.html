<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Login - Vinoth Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #87ceeb,
                #e0f7ff
            );
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            color: #0288d1;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0288d1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0288d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0277bd;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #0288d1;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #555;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🛒 Vinoth Mart
    </div>

    <h2>Buyer Login</h2>

    <form onsubmit="loginBuyer(event)">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>


<script>

async function loginBuyer(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    // Clear old message
    message.textContent = "";


    if (!email || !password) {

        message.style.color = "red";
        message.textContent =
            "Please enter email and password.";

        return;
    }


    try {

        const response = await fetch(
            "http://127.0.0.1:8080/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password,
                    role: "buyer"
                })
            }
        );


        const result =
            await response.json();


        console.log(
            "Backend login response:",
            result
        );


        if (result.success) {

            // Save logged-in buyer
            localStorage.setItem(
                "vinothLoggedInUser",
                JSON.stringify(result.user)
            );


            message.style.color = "green";

            message.textContent =
                "Login successful!";


            // Go to products page
            setTimeout(function () {

                window.location.href =
                    "products.html";

            }, 500);

        }

        else {

            message.style.color = "red";

            message.textContent =
                result.message ||
                "Invalid email or password.";
        }

    }

    catch (error) {

        console.error(
            "Login error:",
            error
        );


        message.style.color = "red";

        message.textContent =
            "Cannot connect to backend.";
    }
}

</script>

</body>
</html>
