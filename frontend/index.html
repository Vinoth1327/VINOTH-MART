<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vinoth Mart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #87ceeb, #e0f7ff);
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #0288d1;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #03a9f4;
            color: white;
        }

        .login-btn:hover {
            background: #0288d1;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🛒 Vinoth Mart</div>

        <p class="subtitle">
            Choose your login
        </p>

        <button class="login-btn" onclick="window.location.href='buyer.html'">
    👤 Buyer 0
    Login
</button>

<button class="login-btn" onclick="window.location.href='seller.html'">
    🏪 Seller Login
</button>

<button class="login-btn" onclick="window.location.href='admin.html'">
    🛡️ Admin Login
</button>

    </div>

</body>
</html>
